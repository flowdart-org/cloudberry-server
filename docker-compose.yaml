  server:
    container_name: server
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm run prisma:migrate && npm run start:dev"
    volumes:
      - ./:/app/
      - /app/node_modules
      - ./.env:/app/.env
      - ./node_modules/@prisma/client:/app/node_modules/@prisma/client
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://postgres:Cloudberry@0@34.93.78.52:5432/cloudberry
      REDIS_URL: redis://34.14.214.83:6379
    env_file:
      - ./.env
    ports:
      - "4000:4000"

volumes:
  db-data:
    name: zen-fashion-studio_db-data
  redis-data:
    name: zen-fashion-studio_redis-data
