services:
  db:
    container_name: zen-fashion-studio_db
    image: postgres:18
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    logging:
      driver: 'none'
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    container_name: zen-fashion-studio_redis
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    logging:
      driver: "none"


  server:
    container_name: server
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app/
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 4000
    env_file:
      - ./.env
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  db-data:
    name: zen-fashion-studio_db-data
  redis-data:
    name: zen-fashion-studio_redis-data
